name: Test Build for Pull Requests
run-name: PR ${{ github.event.pull_request.number }} triggered by @${{ github.actor }}

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Download Dependencies
        run: go mod download
        shell: bash

      - name: Test
        run: make test
        shell: bash

      - name: Build All Targets
        run: make build-all -j
        shell: bash
